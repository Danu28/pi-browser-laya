name: ci
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: fast checks (parallel)
        run: npm run typecheck & npm run lint -- --max-warnings 0 & npm run format:check & wait
      - run: npm test # vitest node, headed:false (no UI); integration uses headed:false by default
        env:
          CI: true
      - run: npm audit --audit-level=moderate
